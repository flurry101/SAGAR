services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sagar_backend_prod
    restart: always
    env_file:
      - .env.production
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
