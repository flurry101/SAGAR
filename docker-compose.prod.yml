services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sagar_backend_prod
    restart: always
    env_file:
      - .env.production
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
    container_name: sagar_frontend_prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
